x-aws-logging: &aws-logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-eu-north-1}
    awslogs-group: ${BATTLEVIVE_LOG_GROUP:-/battlevive/production/application}
    awslogs-create-group: "false"
    tag: "{{.Name}}"

services:
  migration:
    image: ${BATTLEVIVE_GATEWAY_IMAGE:?}
    command: ["python3", "-m", "battlevive_gateway.migrations"]
    depends_on: []
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/battlevive/database-url
    volumes:
      - /run/battlevive:/run/battlevive:ro
    logging: *aws-logging

  gateway:
    image: ${BATTLEVIVE_GATEWAY_IMAGE:?}
    depends_on: []
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/battlevive/database-url
      DISCORD_TOKEN: null
      DISCORD_TOKEN_FILE: /run/battlevive/discord-token
      UPSTREAM_DATA_URL: http://upstream-data:8081
      IMAGE_RENDERER_URL: http://image-renderer:8082
    volumes:
      - /run/battlevive:/run/battlevive:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/ready', timeout=2).close()"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging: *aws-logging

  upstream-data:
    image: ${BATTLEVIVE_UPSTREAM_IMAGE:?}
    environment:
      BATTLEVIVE_API_BASE_URL: ${BATTLEVIVE_API_BASE_URL:-https://battlevive.com}
      BATTLEVIVE_API_KEY: null
      BATTLEVIVE_API_KEY_FILE: /run/battlevive/battlevive-api-key
    volumes:
      - /run/battlevive:/run/battlevive:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/ready', timeout=2).close()"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    logging: *aws-logging

  image-renderer:
    image: ${BATTLEVIVE_RENDERER_IMAGE:?}
    logging: *aws-logging
