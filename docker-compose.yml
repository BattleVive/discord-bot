name: battlevive

x-runtime-security: &runtime-security
  read_only: true
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    container_name: battlevive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-battlevive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-battlevive}
    volumes:
      - ${BATTLEVIVE_POSTGRES_DATA_PATH:-./app/data/postgresql}:/var/lib/postgresql:Z
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-battlevive} -d ${POSTGRES_DB:-battlevive}"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging: *local-logging

  migration:
    image: ${BATTLEVIVE_IMAGE:-voxix/battlevive-bot:latest}
    command: ["python3", "-m", "battlevive_bot.migrations"]
    env_file:
      - ${BATTLEVIVE_ENV_FILE:-.env}
    <<: *runtime-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *local-logging

  bot:
    image: ${BATTLEVIVE_IMAGE:-voxix/battlevive-bot:latest}
    container_name: battlevive-bot
    restart: unless-stopped
    env_file:
      - ${BATTLEVIVE_ENV_FILE:-.env}
    volumes:
      - ${BATTLEVIVE_BOT_DATA_PATH:-./app/data/bot}:/app/data:Z
    <<: *runtime-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 30s
    networks:
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-m", "battlevive_bot.health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging: *local-logging

networks:
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge
