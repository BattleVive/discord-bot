name: battlevive

x-runtime-security: &runtime-security
  read_only: true
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    container_name: battlevive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: battlevive
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: battlevive
    secrets:
      - postgres_password
    volumes:
      - ${BATTLEVIVE_POSTGRES_DATA_PATH:-./app/data/postgresql}:/var/lib/postgresql:Z
      - ./init-db:/docker-entrypoint-initdb.d:ro,Z
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battlevive -d battlevive"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging: *local-logging

  upstream-data:
    image: ${UPSTREAM_DATA_IMAGE:-voxix/battlevive-upstream-data:latest}
    <<: *runtime-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - renderer
      - egress
    environment:
      BATTLEVIVE_API_BASE_URL: ${BATTLEVIVE_API_BASE_URL:-https://battlevive.com}
      BATTLEVIVE_API_KEY: ${BATTLEVIVE_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  migration:
    image: ${GATEWAY_IMAGE:-voxix/battlevive-gateway:latest}
    command: ["python3", "-m", "battlevive_gateway.migrations"]
    <<: *runtime-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  gateway:
    image: ${GATEWAY_IMAGE:-voxix/battlevive-gateway:latest}
    restart: unless-stopped
    <<: *runtime-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 30s
    networks:
      - database
      - renderer
      - egress
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      UPSTREAM_DATA_URL: ${UPSTREAM_DATA_URL:-http://upstream-data:8081}
      IMAGE_RENDERER_URL: ${IMAGE_RENDERER_URL:-http://image-renderer:8082}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISCORD_LOG_LEVEL: ${DISCORD_LOG_LEVEL:-ERROR}
      DISCORD_COMMAND_GUILD_ID: ${DISCORD_COMMAND_GUILD_ID:-}

  image-renderer:
    image: ${IMAGE_RENDERER_IMAGE:-voxix/battlevive-image-renderer:latest}
    <<: *runtime-security
    networks: [renderer]
    restart: unless-stopped

networks:
  database:
    driver: bridge
    internal: true
  renderer:
    driver: bridge
    internal: true
  egress:
    driver: bridge

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
