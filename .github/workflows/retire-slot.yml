name: Retire an expired blue or green slot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: slot-transition
  cancel-in-progress: false

jobs:
  retire:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_operations_bucket: ${{ vars.AWS_OPERATIONS_BUCKET }}
      TF_VAR_operations_bucket_suffix: ${{ vars.TF_OPERATIONS_BUCKET_SUFFIX }}
      TF_VAR_discord_token: ${{ secrets.BOT_TOKEN_STAGING }}
      TF_VAR_battlevive_api_key: ${{ secrets.BATTLEVIVE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Destroy only an expired, non-active slot
        env:
          TF_BLUE_STATE_BUCKET: ${{ vars.TF_BLUE_STATE_BUCKET }}
          TF_GREEN_STATE_BUCKET: ${{ vars.TF_GREEN_STATE_BUCKET }}
          TF_CONTROL_STATE_BUCKET: ${{ vars.TF_CONTROL_STATE_BUCKET }}
        run: |
          retired_slot=$(aws ssm get-parameter --name /battlevive/production/control/retired-slot --query 'Parameter.Value' --output text 2>/dev/null || true)
          retire_after=$(aws ssm get-parameter --name /battlevive/production/control/retire-after --query 'Parameter.Value' --output text 2>/dev/null || true)
          active_slot=$(aws ssm get-parameter --name /battlevive/production/control/active-slot --query 'Parameter.Value' --output text)
          [[ -n "$retired_slot" && -n "$retire_after" ]] || exit 0
          [[ "$retired_slot" == blue || "$retired_slot" == green ]] || { echo 'invalid retired slot' >&2; exit 1; }
          [[ "$retired_slot" != "$active_slot" ]] || { echo 'refusing to destroy the active slot' >&2; exit 1; }
          [[ $(date -u +%s) -ge $(date -u --date="$retire_after" +%s) ]] || exit 0
          case "$retired_slot" in
            blue) bucket=$TF_BLUE_STATE_BUCKET ;;
            green) bucket=$TF_GREEN_STATE_BUCKET ;;
          esac
          test -n "$bucket" && test -n "$TF_CONTROL_STATE_BUCKET"
          terraform -chdir="infra/slots/$retired_slot" init -backend-config="bucket=$bucket"
          terraform -chdir="infra/slots/$retired_slot" destroy -auto-approve
          terraform -chdir=infra/production init -backend-config="bucket=$TF_CONTROL_STATE_BUCKET"
          terraform -chdir=infra/production apply -auto-approve \
            -var="active_slot=$active_slot" \
            -var="release_candidate_slot=$retired_slot"
