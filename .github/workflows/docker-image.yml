name: Docker Image

on:
  workflow_run:
    workflows: ["Test Suite"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify tests passed
        env:
          TEST_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: test "$TEST_CONCLUSION" = "success"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: >-
          ${{ github.event.workflow_run.event == 'push' &&
              github.event.workflow_run.head_branch == 'main' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'main' }}
          tags: |
            voxix/battlevive-bot:latest
            voxix/battlevive-bot:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
