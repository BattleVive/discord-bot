name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    outputs:
      passed: ${{ steps.test_report.outputs.passed }}
      failed: ${{ steps.test_report.outputs.failed }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: battlevive_test
          POSTGRES_PASSWORD: battlevive_test
          POSTGRES_DB: battlevive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U battlevive_test -d battlevive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: postgresql://battlevive_test:battlevive_test@localhost:5432/battlevive_test
      TEST_DATABASE_URL: postgresql://battlevive_test:battlevive_test@localhost:5432/battlevive_test
      DISCORD_TOKEN: test-discord-token
      BATTLEVIVE_URL: https://battlevive.test
      BOOTSTRAP_JWT: test-jwt
      BOOTSTRAP_REFRESH_TOKEN: test-refresh
      SUPABASE_API_KEY: test-supabase-key
      SUPABASE_URL: https://supabase.test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app utils

      - name: Run test suite
        run: pytest --junitxml=test-results/pytest.xml

      - name: Publish test report
        if: ${{ !cancelled() }}
        id: test_report
        uses: dorny/test-reporter@v2
        with:
          name: Pytest results
          path: test-results/pytest.xml
          reporter: java-junit
          fail-on-error: "false"

  badge:
    name: Test badge
    needs: test
    if: >-
      ${{ always() &&
          !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.test.outputs.passed != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish test badge
        uses: actions/github-script@v7
        if: >-
          ${{ needs.test.outputs.passed != '' }}
        env:
          PASSED: ${{ needs.test.outputs.passed }}
          FAILED: ${{ needs.test.outputs.failed }}
        with:
          script: |
            const passed = Number.parseInt(process.env.PASSED, 10)
            const failed = Number.parseInt(process.env.FAILED, 10)

            if (!Number.isSafeInteger(passed) || passed < 0 ||
                !Number.isSafeInteger(failed) || failed < 0) {
              core.setFailed('Test reporter returned invalid badge counts')
              return
            }

            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = 'badges'
            const path = 'tests.json'
            const message = `${passed} passed | ${failed} failed`
            const badge = `${JSON.stringify({
              schemaVersion: 1,
              label: 'tests',
              message,
              color: failed === 0 ? 'brightgreen' : 'red'
            })}\n`
            const commitMessage = `Badge: ${message}`

            let branchExists = true
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              })
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
              branchExists = false
            }

            if (!branchExists) {
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content: badge,
                encoding: 'utf-8'
              })
              const tree = await github.rest.git.createTree({
                owner,
                repo,
                tree: [{
                  path,
                  mode: '100644',
                  type: 'blob',
                  sha: blob.data.sha
                }]
              })
              const commit = await github.rest.git.createCommit({
                owner,
                repo,
                message: commitMessage,
                tree: tree.data.sha,
                parents: []
              })
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: commit.data.sha
              })
              return
            }

            let existing = null
            try {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: branch
              })
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                core.setFailed(`${path} on ${branch} is not a file`)
                return
              }
              existing = response.data
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            if (existing) {
              const current = Buffer.from(
                existing.content,
                'base64'
              ).toString('utf8')
              if (current === badge) {
                return
              }
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: commitMessage,
              content: Buffer.from(badge).toString('base64'),
              branch,
              ...(existing ? {sha: existing.sha} : {})
            })
