name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  checks: write
  contents: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: battlevive_test
          POSTGRES_PASSWORD: battlevive_test
          POSTGRES_DB: battlevive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U battlevive_test -d battlevive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: postgresql://battlevive_test:battlevive_test@localhost:5432/battlevive_test
      TEST_DATABASE_URL: postgresql://battlevive_test:battlevive_test@localhost:5432/battlevive_test
      DISCORD_TOKEN: test-discord-token
      BATTLEVIVE_URL: https://battlevive.test
      BOOTSTRAP_JWT: test-jwt
      BOOTSTRAP_REFRESH_TOKEN: test-refresh
      SUPABASE_API_KEY: test-supabase-key
      SUPABASE_URL: https://supabase.test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app utils

      - name: Run test suite
        run: pytest --junitxml=test-results/pytest.xml

      - name: Publish test report
        if: ${{ !cancelled() }}
        id: test_report
        uses: dorny/test-reporter@v2
        with:
          name: Pytest results
          path: test-results/pytest.xml
          reporter: java-junit
          fail-on-error: "false"

      - name: Check out test badge data
        if: >-
          ${{ !cancelled() &&
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main' &&
              steps.test_report.outputs.passed != '' }}
        uses: actions/checkout@v4
        with:
          ref: badges
          path: test-badge

      - name: Update test badge
        if: >-
          ${{ !cancelled() &&
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main' &&
              steps.test_report.outputs.passed != '' }}
        env:
          PASSED: ${{ steps.test_report.outputs.passed }}
          FAILED: ${{ steps.test_report.outputs.failed }}
        run: |
          color=brightgreen
          if [ "$FAILED" != "0" ]; then
            color=red
          fi

          jq --compact-output \
            --arg message "$PASSED passed | $FAILED failed" \
            --arg color "$color" \
            '{schemaVersion: 1, label: "tests", message: $message, color: $color}' \
            > test-badge/tests.json

          cd test-badge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Badge: $PASSED passed, $FAILED failed"
          git push
