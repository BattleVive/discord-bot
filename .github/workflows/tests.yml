name: Pull Request Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests
    uses: ./.github/workflows/quality.yml
    with:
      checkout_ref: ${{ github.sha }}

  image-build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: services/gateway/Dockerfile
          - name: upstream-data
            dockerfile: services/upstream-data/Dockerfile
          - name: image-renderer
            dockerfile: services/image-renderer/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: battlevive-ci:${{ matrix.name }}
          cache-from: type=gha,scope=pr-image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pr-image-${{ matrix.name }}

      - name: Verify image runtime identity
        run: |
          test "$(docker image inspect battlevive-ci:${{ matrix.name }} --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint python3 battlevive-ci:${{ matrix.name }} --version
