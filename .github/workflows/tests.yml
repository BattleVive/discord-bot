name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality suite
    permissions:
      checks: write
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      checkout_ref: ${{ github.sha }}

  badge:
    name: Test badge
    needs: quality
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'push' &&
          github.ref == 'refs/heads/main' && needs.quality.outputs.passed != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish test badge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PASSED: ${{ needs.quality.outputs.passed }}
          FAILED: ${{ needs.quality.outputs.failed }}
        with:
          script: |
            const passed = Number.parseInt(process.env.PASSED, 10)
            const failed = Number.parseInt(process.env.FAILED, 10)
            if (!Number.isSafeInteger(passed) || passed < 0 ||
                !Number.isSafeInteger(failed) || failed < 0) {
              core.setFailed('Test reporter returned invalid badge counts')
              return
            }
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = 'badges'
            const path = 'tests.json'
            const message = `${passed} passed | ${failed} failed`
            const badge = `${JSON.stringify({
              schemaVersion: 1,
              label: 'tests',
              message,
              color: failed === 0 ? 'brightgreen' : 'red'
            })}\n`
            const commitMessage = `Badge: ${message}`
            let branchExists = true
            try {
              await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`})
            } catch (error) {
              if (error.status !== 404) throw error
              branchExists = false
            }
            if (!branchExists) {
              const blob = await github.rest.git.createBlob({owner, repo, content: badge, encoding: 'utf-8'})
              const tree = await github.rest.git.createTree({
                owner, repo, tree: [{path, mode: '100644', type: 'blob', sha: blob.data.sha}]
              })
              const commit = await github.rest.git.createCommit({
                owner, repo, message: commitMessage, tree: tree.data.sha, parents: []
              })
              await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha})
              return
            }
            let existing = null
            try {
              const response = await github.rest.repos.getContent({owner, repo, path, ref: branch})
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                core.setFailed(`${path} on ${branch} is not a file`)
                return
              }
              existing = response.data
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (existing && Buffer.from(existing.content, 'base64').toString('utf8') === badge) return
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: commitMessage,
              content: Buffer.from(badge).toString('base64'),
              branch,
              ...(existing ? {sha: existing.sha} : {})
            })
