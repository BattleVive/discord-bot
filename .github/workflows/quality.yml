name: Reusable Quality Suite

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_DB: battlevive_test
          POSTGRES_PASSWORD: battlevive_test
          POSTGRES_USER: battlevive_test
        options: >-
          --health-cmd "pg_isready -U battlevive_test -d battlevive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock

      - name: Compile Python files
        run: python -m compileall services/gateway/app services/upstream-data/app services/image-renderer/app scripts

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgresql://battlevive_test:battlevive_test@127.0.0.1:5432/battlevive_test
        run: pytest -q
