name: Reusable Quality Suite

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock

      - name: Compile Python files
        run: python -m compileall services/gateway/app services/upstream-data/app services/image-renderer/app scripts

      - name: Run unit tests
        run: pytest -q --ignore=tests/test_postgres.py
