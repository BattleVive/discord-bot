name: Deploy an immutable slot manifest

on:
  workflow_call:
    inputs:
      slot:
        required: true
        type: string
      bundle_key:
        required: true
        type: string
      bundle_checksum:
        required: true
        type: string
      manifest_key:
        required: true
        type: string
      manifest_checksum:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      slot:
        description: Slot to receive the release
        required: true
        type: choice
        options: [blue, green]
      bundle_key:
        description: S3 object key for the immutable bundle
        required: true
        type: string
      bundle_checksum:
        description: SHA-256 of the bundle, without the sha256 prefix
        required: true
        type: string
      manifest_key:
        description: S3 object key for the immutable release manifest
        required: true
        type: string
      manifest_checksum:
        description: SHA-256 of the manifest, without the sha256 prefix
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: deploy-${{ inputs.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable deployment inputs
        env:
          SLOT: ${{ inputs.slot }}
          BUNDLE_KEY: ${{ inputs.bundle_key }}
          BUNDLE_CHECKSUM: ${{ inputs.bundle_checksum }}
          MANIFEST_KEY: ${{ inputs.manifest_key }}
          MANIFEST_CHECKSUM: ${{ inputs.manifest_checksum }}
        run: |
          [[ "$SLOT" == blue || "$SLOT" == green ]]
          [[ "$BUNDLE_KEY" =~ ^releases/[A-Za-z0-9._/-]+$ && "$BUNDLE_KEY" != *..* ]]
          [[ "$MANIFEST_KEY" =~ ^releases/[A-Za-z0-9._/-]+$ && "$MANIFEST_KEY" != *..* ]]
          [[ "$BUNDLE_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
          [[ "$MANIFEST_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: command
        env:
          SLOT: ${{ inputs.slot }}
          BUNDLE_KEY: ${{ inputs.bundle_key }}
          BUNDLE_CHECKSUM: ${{ inputs.bundle_checksum }}
          MANIFEST_KEY: ${{ inputs.manifest_key }}
          MANIFEST_CHECKSUM: ${{ inputs.manifest_checksum }}
        run: |
          parameters=$(jq -cn \
            --arg bundle_key "$BUNDLE_KEY" \
            --arg bundle_checksum "$BUNDLE_CHECKSUM" \
            --arg manifest_key "$MANIFEST_KEY" \
            --arg manifest_checksum "$MANIFEST_CHECKSUM" \
            '{bundleKey: [$bundle_key], bundleChecksum: [$bundle_checksum],
              manifestKey: [$manifest_key], manifestChecksum: [$manifest_checksum]}')
          command_id=$(aws ssm send-command \
            --document-name "battlevive-$SLOT-deploy" \
            --targets "Key=tag:SSMTarget,Values=battlevive-$SLOT" \
            --parameters "$parameters" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          [[ "$command_id" =~ ^[0-9a-f-]+$ ]]
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - name: Require one successful SSM invocation
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          deadline=$((SECONDS + 600))
          while ((SECONDS <= deadline)); do
            invocations=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --output json)
            count=$(jq '.CommandInvocations | length' <<<"$invocations")
            [[ "$count" -le 1 ]] || { echo 'slot selector matched more than one instance' >&2; exit 1; }
            status=$(jq -r '.CommandInvocations[0].Status // "Pending"' <<<"$invocations")
            case "$status" in
              Success) exit 0 ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *) echo "SSM deployment ended with status: $status" >&2; exit 1 ;;
            esac
          done
          echo 'SSM deployment exceeded the ten-minute budget' >&2
          exit 1
