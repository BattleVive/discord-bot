name: Stable Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        run: |
          base=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [[ -z "$base" ]]; then
            echo "A prior release tag is required for image change detection." >&2
            exit 1
          fi
          missing=()
          for entry in \
            'gateway-service services/gateway ghcr.io/battlevive/gateway-service' \
            'upstream-service services/upstream-data ghcr.io/battlevive/upstream-service' \
            'image-renderer services/image-renderer ghcr.io/battlevive/image-renderer'; do
            read -r name context image <<<"$entry"
            version=$(tr -d '\n' < "$context/VERSION")
            if ! docker manifest inspect "$image:$version" >/dev/null 2>&1; then
              missing+=(--missing-service "$name")
            fi
          done
          python scripts/release/plan_from_git.py --base "$base" "${missing[@]}" > release-plan.json
          echo "services=$(tr -d '\n' < release-plan.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gateway-service
            version_file: services/gateway/VERSION
            dockerfile: services/gateway/Dockerfile
            image: ghcr.io/battlevive/gateway-service
          - name: upstream-service
            version_file: services/upstream-data/VERSION
            dockerfile: services/upstream-data/Dockerfile
            image: ghcr.io/battlevive/upstream-service
          - name: image-renderer
            version_file: services/image-renderer/VERSION
            dockerfile: services/image-renderer/Dockerfile
            image: ghcr.io/battlevive/image-renderer
    outputs:
      # Digests are collected by the manifest job from the immutable tags.
      marker: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: version
        if: ${{ fromJSON(needs.plan.outputs.services).services[matrix.name].push }}
        run: echo "value=$(tr -d '\n' < '${{ matrix.version_file }}')" >> "$GITHUB_OUTPUT"
      - id: tags
        if: ${{ fromJSON(needs.plan.outputs.services).services[matrix.name].push }}
        run: |
          {
            echo 'value<<EOF'
            python scripts/release/image_tags.py --version '${{ steps.version.outputs.value }}' |
              while IFS= read -r tag; do echo '${{ matrix.image }}:'"$tag"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: ${{ fromJSON(needs.plan.outputs.services).services[matrix.name].push }}
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Make package public
        if: ${{ fromJSON(needs.plan.outputs.services).services[matrix.name].push }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --request PATCH \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"visibility":"public"}' \
            "https://api.github.com/orgs/BattleVive/packages/container/${{ matrix.name }}"

  manifest:
    if: ${{ always() && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the immutable release bundle
        run: |
          python scripts/release/bundle.py --output release-bundle.tar.gz >/dev/null
      - name: Resolve every service tag to an immutable digest
        run: |
          for entry in \
            'gateway-service services/gateway ghcr.io/battlevive/gateway-service' \
            'upstream-service services/upstream-data ghcr.io/battlevive/upstream-service' \
            'image-renderer services/image-renderer ghcr.io/battlevive/image-renderer'; do
            read -r name context image <<<"$entry"
            version=$(tr -d '\n' < "$context/VERSION")
            digest=$(docker buildx imagetools inspect "$image:$version" --format '{{.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s=%s\n' "$name" "$version" "$digest" >> services.txt
          done
      - name: Create and validate the release manifest
        run: |
          args=()
          while IFS= read -r service; do args+=(--service "$service"); done < services.txt
          python scripts/release/build_manifest.py \
            --bot-version "${GITHUB_REF_NAME#v}" \
            --revision "$GITHUB_SHA" \
            --bundle release-bundle.tar.gz \
            --output release-manifest.json \
            "${args[@]}"
          python scripts/release/release_manifest.py --validate < release-manifest.json
          sha256sum release-manifest.json > release-manifest.json.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.release.tag_name }}
          if-no-files-found: error
          path: |
            release-bundle.tar.gz
            release-manifest.json
            release-manifest.json.sha256

  archive:
    needs: manifest
    environment: release-archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      bundle_key: ${{ steps.keys.outputs.bundle_key }}
      manifest_key: ${{ steps.keys.outputs.manifest_key }}
      bundle_checksum: ${{ steps.keys.outputs.bundle_checksum }}
      manifest_checksum: ${{ steps.keys.outputs.manifest_checksum }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.event.release.tag_name }}
      - name: Verify the downloaded immutable artifacts
        run: |
          sha256sum --check release-manifest.json.sha256
          test -s release-bundle.tar.gz
          test -s release-manifest.json
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: keys
        env:
          OPERATIONS_BUCKET: ${{ vars.AWS_OPERATIONS_BUCKET }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          revision=$(jq -r .source_revision release-manifest.json)
          bundle_key="releases/$tag/$revision.tar.gz"
          manifest_key="releases/$tag/$revision.manifest.json"
          aws s3 cp release-bundle.tar.gz "s3://$OPERATIONS_BUCKET/$bundle_key" --only-show-errors
          aws s3 cp release-manifest.json "s3://$OPERATIONS_BUCKET/$manifest_key" --only-show-errors
          {
            echo "bundle_key=$bundle_key"
            echo "manifest_key=$manifest_key"
            echo "bundle_checksum=$(sha256sum release-bundle.tar.gz | cut -d' ' -f1)"
            echo "manifest_checksum=$(sha256sum release-manifest.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

  stage-inactive-slot:
    needs: archive
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_operations_bucket: ${{ vars.AWS_OPERATIONS_BUCKET }}
      TF_VAR_discord_token: ${{ secrets.BOT_TOKEN_STAGING }}
      TF_VAR_battlevive_api_key: ${{ secrets.BATTLEVIVE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: slot
        name: Select the inactive slot
        run: |
          active=$(aws ssm get-parameter \
            --name /battlevive/production/control/active-slot \
            --query 'Parameter.Value' --output text)
          case "$active" in
            blue) candidate=green ;;
            green) candidate=blue ;;
            *) echo "invalid active slot: $active" >&2; exit 1 ;;
          esac
          echo "slot=$candidate" >> "$GITHUB_OUTPUT"
      - name: Apply the inactive slot with the staging token
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          TF_BLUE_STATE_BUCKET: ${{ vars.TF_BLUE_STATE_BUCKET }}
          TF_GREEN_STATE_BUCKET: ${{ vars.TF_GREEN_STATE_BUCKET }}
        run: |
          case "$SLOT" in
            blue) bucket=$TF_BLUE_STATE_BUCKET ;;
            green) bucket=$TF_GREEN_STATE_BUCKET ;;
            *) exit 1 ;;
          esac
          test -n "$bucket"
          terraform -chdir="infra/slots/$SLOT" init -backend-config="bucket=$bucket"
          terraform -chdir="infra/slots/$SLOT" apply -auto-approve

  deploy-staged-slot:
    needs: [archive, stage-inactive-slot]
    uses: ./.github/workflows/deploy.yml
    with:
      slot: ${{ needs.stage-inactive-slot.outputs.slot }}
      bundle_key: ${{ needs.archive.outputs.bundle_key }}
      bundle_checksum: ${{ needs.archive.outputs.bundle_checksum }}
      manifest_key: ${{ needs.archive.outputs.manifest_key }}
      manifest_checksum: ${{ needs.archive.outputs.manifest_checksum }}
    secrets: inherit
