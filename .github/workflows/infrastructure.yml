name: Infrastructure

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infrastructure.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, apply, destroy]
      root:
        description: Managed state root
        required: true
        type: choice
        options: [production, blue, green, e2e]

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.event.inputs.root || github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: Terraform static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - name: Terraform format and validate every root
        run: |
          terraform fmt -check -recursive infra
          for root in infra/bootstrap infra/production infra/slots/blue infra/slots/green infra/e2e; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done
      - name: TFLint
        run: |
          tflint --init
          for root in infra/bootstrap infra/production infra/slots/blue infra/slots/green infra/e2e; do
            tflint --chdir="$root"
          done
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          trivyignores: infra/.trivyignore

  requested-operation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: static
    environment: ${{ github.event.inputs.action == 'plan' && 'infrastructure-plan' || 'infrastructure-apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_operations_bucket: ${{ github.event.inputs.root == 'e2e' && vars.TF_E2E_OPERATIONS_BUCKET || vars.TF_OPERATIONS_BUCKET }}
      TF_VAR_operations_bucket_suffix: ${{ vars.TF_OPERATIONS_BUCKET_SUFFIX }}
      TF_VAR_discord_token: ${{ secrets.TF_SLOT_DISCORD_TOKEN }}
      TF_VAR_active_slot: ${{ vars.TF_ACTIVE_SLOT }}
      TF_VAR_release_candidate_slot: ${{ vars.TF_RELEASE_CANDIDATE_SLOT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ github.event.inputs.action == 'plan' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN || vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Restrict destroy to disposable e2e infrastructure
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.root != 'e2e' }}
        run: |
          echo 'Only the disposable e2e root may be destroyed from this workflow.' >&2
          exit 1
      - name: Initialize selected isolated state root
        run: |
          case '${{ github.event.inputs.root }}' in
            production) root=infra/production ;;
            blue) root=infra/slots/blue ;;
            green) root=infra/slots/green ;;
            e2e) root=infra/e2e ;;
          esac
          echo "TF_ROOT=$root" >> "$GITHUB_ENV"
          terraform -chdir="$root" init -backend-config="bucket=${{ github.event.inputs.root == 'e2e' && vars.TF_E2E_STATE_BUCKET || vars.TF_STATE_BUCKET }}"
      - name: Create reviewed plan
        run: terraform -chdir="$TF_ROOT" plan -no-color -out=reviewed.tfplan
      - name: Apply approved plan
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform -chdir="$TF_ROOT" apply -auto-approve reviewed.tfplan
      - name: Destroy a disposable e2e root
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.root == 'e2e' }}
        run: terraform -chdir="$TF_ROOT" destroy -auto-approve -lock-timeout=5m
